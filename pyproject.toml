[project]
name = "netshecan"
version = "2.1.1"
description = "NetShecan multi-provider data quota monitor"
requires-python = ">=3.14,<3.15"
dependencies = [
    "flet==0.86.2",
    "pystray",
    "Pillow",
    "persiantools==6.2.0",
]

[tool.flet]
product = "NetShecan"
company = "NetShecan"
copyright = "Copyright © 2026 NetShecan"
build_number = 1

[tool.flet.app]
module = "netshecan"
exclude = [".git", ".venv", "__pycache__", "dist", "releases", "temp_tci.json"]

[tool.flet.windows]
artifact = "NetShecan"
