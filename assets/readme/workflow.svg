<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180"
     role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">How NetShecan stays logged in</title>
  <desc id="wf-desc">NetShecan stores a long-lived refresh token, exchanges it for a short-lived access token before it expires, and reads your remaining data.</desc>

  <rect width="1200" height="180" rx="20" fill="#0B2432"/>

  <!-- Step 1: Refresh token -->
  <g transform="translate(60 60)">
    <rect width="230" height="60" rx="12" fill="#12384E"/>
    <text x="115" y="26" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="16" font-weight="700" fill="#FABD32">REFRESH TOKEN</text>
    <text x="115" y="46" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
          font-size="15" fill="#9FC3D4">stored in config</text>
  </g>

  <!-- arrow 1 -->
  <path d="M 305 90 L 355 90" stroke="#1B4A64" stroke-width="4" stroke-linecap="round"/>
  <path d="M 348 82 L 360 90 L 348 98" fill="none" stroke="#1B4A64" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 2: Exchange for access token -->
  <g transform="translate(370 60)">
    <rect width="230" height="60" rx="12" fill="#12384E"/>
    <text x="115" y="26" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="16" font-weight="700" fill="#FABD32">EXCHANGE</text>
    <text x="115" y="46" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
          font-size="15" fill="#9FC3D4">short-lived access token</text>
  </g>

  <!-- arrow 2 -->
  <path d="M 615 90 L 665 90" stroke="#1B4A64" stroke-width="4" stroke-linecap="round"/>
  <path d="M 658 82 L 670 90 L 658 98" fill="none" stroke="#1B4A64" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 3: Fetch data -->
  <g transform="translate(680 60)">
    <rect width="230" height="60" rx="12" fill="#12384E"/>
    <text x="115" y="26" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="16" font-weight="700" fill="#FABD32">FETCH</text>
    <text x="115" y="46" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
          font-size="15" fill="#9FC3D4">remaining / used / total</text>
  </g>

  <!-- arrow 3 -->
  <path d="M 925 90 L 975 90" stroke="#1B4A64" stroke-width="4" stroke-linecap="round"/>
  <path d="M 968 82 L 980 90 L 968 98" fill="none" stroke="#1B4A64" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 4: Show dashboard -->
  <g transform="translate(990 60)">
    <rect width="150" height="60" rx="12" fill="#FABD32"/>
    <text x="75" y="26" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
          font-size="16" font-weight="700" fill="#0B2432">DASHBOARD</text>
    <text x="75" y="46" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
          font-size="15" font-weight="600" fill="#0B2432">ring + alerts</text>
  </g>
</svg>
