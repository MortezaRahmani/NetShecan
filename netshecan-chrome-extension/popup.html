<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      margin: 0;
      padding: 12px;
      width: 340px;
      color: #e6edf3;
      background: #0b2432;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 8px;
    }
    .hint {
      color: #9fc3d4;
      font-size: 11px;
      margin-bottom: 10px;
    }
    #status {
      font-size: 12px;
      min-height: 16px;
      margin-bottom: 10px;
    }
    pre {
      background: #12384e;
      border-radius: 6px;
      padding: 8px;
      font-family: Consolas, monospace;
      font-size: 11px;
      max-height: 200px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
      color: #c3dce6;
    }
    button {
      background: #fabd32;
      color: #0b2432;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }
    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
</head>
<body>
  <h1>NetShecan Helper</h1>
  <div class="hint">Open the provider's site (logged in), then copy the token JSON and paste it into NetShecan.</div>
  <div id="status"></div>
  <pre id="json"></pre>
  <button id="copy" disabled>Copy JSON</button>
  <script src="popup.js"></script>
</body>
</html>
